services:
  lapscope:
    build: .
    container_name: lapscope
    ports:
      # loopback only: the API has no authentication and must sit behind a
      # gateway that does (SplitTime change; upstream published on all interfaces)
      - "127.0.0.1:8000:8000"   # web dashboard: http://localhost:8000
      - "9999:9999/udp"    # Driver A (only when configured)
      - "10000:10000/udp"  # Driver B (only when configured)
    volumes:
      - ./data:/app/data   # SQLite session recordings
    environment:
      # set LS_KEEP_DISCARDED=1 in the host env to keep sessions with no
      # completed laps (for capturing event types the recorder doesn't
      # recognize yet - see README "An event type isn't being recorded")
      - LS_KEEP_DISCARDED=${LS_KEEP_DISCARDED:-0}
      # Set JSON in .env, e.g. SPLITTIME_DRIVERS=[{"id":"alpha",...}]
      - SPLITTIME_DRIVERS=${SPLITTIME_DRIVERS:-}
      # Optional server-side key; costly generation must be protected by your gateway.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # The rest are described under Settings in the README.
      - LS_ALLOWED_HOSTS=${LS_ALLOWED_HOSTS:-}
      - LS_OFFLINE=${LS_OFFLINE:-0}
      - SPLITTIME_AUTO_RACE_REPORTS=${SPLITTIME_AUTO_RACE_REPORTS:-1}
      - SPLITTIME_AUTO_RECAPS=${SPLITTIME_AUTO_RECAPS:-1}
      - RECAP_TZ=${RECAP_TZ:-America/Halifax}
    restart: unless-stopped
    logging:
      # Docker's default json-file driver never rotates. A recorder that
      # starts failing logs at telemetry rate, so an unbounded log is one
      # more way to fill the disk that caused the failure (issue #64).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
