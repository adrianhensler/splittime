name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # matches the Docker base image

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Packet round-trip self-test
        run: python app/telemetry/packet.py

      - name: Tests (pytest)
        run: pytest -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          for file in app/static/js/*.js; do node --check "$file"; done

      - name: UI controller tests
        run: node --test tests/ui/*.test.cjs

  # Advisory (ADR 21): reports drift between a pull request and its packets,
  # never blocks a merge. A red mark here is a prompt for the reviewer.
  records:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Workpacket records (advisory)
        run: python scripts/check_workpackets.py --event "$GITHUB_EVENT_PATH"
