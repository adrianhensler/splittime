name: Two-driver backend checks
on:
  push:
    branches:
      - feat/gpt6-two-driver-backend
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/two-driver.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint Python
        run: ruff check .
      - name: Driver/isolation regression tests
        run: pytest -q tests/test_multi_driver.py tests/test_driver_review.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Driver-scoped browser grouping
        run: node --test tests/ui/driver-groups.test.cjs
