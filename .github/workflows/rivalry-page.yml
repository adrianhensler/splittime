name: Real-data rivalry page checks
on:
  pull_request:
    paths:
      - 'app/static/**'
      - 'tests/ui/**'
      - '.github/workflows/rivalry-page.yml'
  push:
    branches:
      - feat/gpt6-rivalry-page
jobs:
  browser-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app/static/js/rivalry.js
      - name: UI controller tests
        run: node --test tests/ui/*.test.cjs
